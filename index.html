    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#216a4c"><title>Biológia — testovač</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182720;background:#f3f6f3;font-synthesis:none;--green:#216a4c;--muted:#607068;--line:#dce5de;--paper:#fff}*{box-sizing:border-box}body{margin:0}main{max-width:880px;margin:auto;padding:32px 24px 16px}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.45}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #377aca;outline-offset:4px}h1,h2,p{margin:0}h1{font-size:28px;letter-spacing:-.7px}h2{font-size:20px;line-height:1.5}small,.muted{color:var(--muted);font-size:13px}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.header .muted{margin-top:5px}.overall{text-align:right;white-space:nowrap}.overall strong{font-size:22px;font-weight:600}.overall p{font-size:12px;color:var(--muted)}.categories{display:grid;gap:9px}.category{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}.category-open{border:0;text-align:left;background:transparent;display:grid;grid-template-columns:28px minmax(0,1fr);gap:5px 12px;padding:15px 17px;color:inherit}.category-open:hover{background:#f6faf7}.number{color:var(--muted);font-size:13px;padding-top:2px}.category-title{font-size:15px;font-weight:600;line-height:1.4}.category-meta{grid-column:2;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}.track{height:4px;border-radius:3px;overflow:hidden;background:#edf1ee;grid-column:2}.track span{height:100%;display:block;background:var(--green)}.problem-link{align-self:center;margin:8px 12px;padding:10px;border:0;background:transparent;color:var(--muted);border-radius:8px;font-size:12px;min-height:44px}.problem-link:hover{background:#faf3e3;color:#765309}.launch{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;border:0;border-radius:10px;background:var(--green);color:white;padding:20px;margin-top:20px;font-size:16px;text-align:left}.launch strong{font-weight:600}.launch:hover,.primary:hover{background:#18563c}.test-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btn{padding:11px 16px;min-height:44px;border:1px solid var(--line);background:white;color:inherit;border-radius:9px;font-size:14px}.btn:hover{background:#edf3ef}.primary{background:var(--green);color:white;border-color:var(--green)}.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.quiz-title{font-size:13px;color:var(--muted);line-height:1.5;text-align:right}.quiz-progress{height:5px;margin-bottom:20px}.question{background:white;border:1px solid var(--line);border-radius:12px;padding:24px}.answers{display:grid;gap:11px;margin-top:22px}.answer{display:flex;align-items:center;gap:12px;border:2px solid #e1e7e3;border-radius:10px;padding:15px;line-height:1.5;cursor:pointer;min-height:58px;overflow-wrap:anywhere}.answer:hover{background:#f7faf8}.answer input{width:21px;height:21px;accent-color:var(--green);flex-shrink:0;margin:0}.answer .answer-text{flex:1}.answer.good{background:#d8f5e6;border-color:#168765}.answer.bad{background:#ffe4e6;border-color:#e74c58}.answer.locked{cursor:default}.answer input:disabled{opacity:1}.mark{font-weight:700;font-size:20px;color:#ce3447}.mark.ok{color:#137251}.feedback{margin-top:17px;line-height:1.5;font-size:14px}.feedback.correct{color:#137251}.feedback.incorrect{color:#b2293f}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:18px}.actions-group{display:flex;flex-wrap:wrap;gap:8px}.starred{color:#805800;background:#fff6da;border-color:#e8d6a2}.position{display:flex;align-items:center;font-size:13px;color:var(--muted)}.empty,.result{padding:30px;background:white;border:1px solid var(--line);border-radius:12px;text-align:center}.result .score{font-size:44px;color:var(--green);font-weight:600;margin:14px 0}.result p{margin:10px 0;color:var(--muted)}.result .actions{justify-content:center}.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:8px;margin-top:20px}.review-grid button{min-height:44px;border-radius:7px;border:1px solid #b2d9c3;background:#d8f5e6;color:#164c35}.review-grid button.wrong{background:#ffe4e6;border-color:#f1b2bc;color:#8e2534}footer{max-width:880px;margin:0 auto;padding:16px 24px 28px;font-size:12px;color:var(--muted)}footer p{line-height:1.6;margin-top:10px}footer a{color:inherit}summary{cursor:pointer;width:fit-content}#storage-warning{margin:12px auto;max-width:832px;background:#fff0cc;padding:15px;border-radius:8px;color:#785000}dialog{border:1px solid var(--line);border-radius:14px;max-width:420px;width:calc(100% - 32px);padding:24px;color:inherit}dialog::backdrop{background:#18272055}dialog p{line-height:1.5;margin:12px 0 20px}dialog .actions{justify-content:flex-end}[hidden]{display:none!important}@media(min-width:1000px){main{padding-top:45px}}@media(max-width:520px){main{padding:20px 12px 12px}.header{margin-bottom:18px}h1{font-size:25px}.category{grid-template-columns:minmax(0,1fr)}.category-open{padding:13px 13px 8px;grid-template-columns:22px minmax(0,1fr);gap:4px 9px}.problem-link{justify-self:start;margin:0 0 4px 34px;padding:7px 10px;min-height:36px}.category-title{font-size:14px}.question{padding:18px 14px}h2{font-size:18px}.answer{padding:12px 10px;font-size:15px;gap:9px}.quiz-top{align-items:flex-start}.quiz-title{max-width:65%}.actions{gap:12px}.actions-group{gap:6px}.btn{padding:10px 12px}.launch{padding:18px}.overall strong{font-size:20px}footer{padding:14px 16px 24px}}

<body><main id="app"></main><p id="storage-warning" role="alert" hidden>Prehliadač nepovolil uloženie. Progres sa po zatvorení nemusí zachovať.</p><footer>Mony</footer><script>const CATEGORIES = [{"id":1,"name":"Úvod do mikroskopickej techniky","questions":[{"id":"1-1","number":1,"category":1,"text":"Aké žiarenie sa využíva pri fluorescenčnej mikroskopii?","options":["infračervené žiarenie","viditeľné excitačné svetlo","ultrafialové žiarenie","prúd elektrónov"],"correct":[false,true,true,false],"fingerprint":"Aké žiarenie sa využíva pri fluorescenčnej mikroskopii?|infračervené žiarenie|viditeľné excitačné svetlo|ultrafialové žiarenie|prúd elektrónov"},{"id":"1-2","number":2,"category":1,"text":"Aké farbivo sa najčastejšie využíva pri vizualizácii chromozómov?","options":["modrý atrament","Giemsovo","Lugolov roztok","hematoxylín a eozín"],"correct":[false,true,false,false],"fingerprint":"Aké farbivo sa najčastejšie využíva pri vizualizácii chromozómov?|modrý atrament|Giemsovo|Lugolov roztok|hematoxylín a eozín"},{"id":"1-3","number":3,"category":1,"text":"Aké zväčšenie získame, ak použijeme objektív s 40× zväčšením a okulár s 10× zväčšením?","options":["400×","10×","40×","4×"],"correct":[true,false,false,false],"fingerprint":"Aké zväčšenie získame, ak použijeme objektív s 40× zväčšením a okulár s 10× zväčšením?|400×|10×|40×|4×"},{"id":"1-4","number":4,"category":1,"text":"Elektrónové mikroskopy ako zdroj žiarenia používajú:","options":["biele svetlo","biele svetlo alebo ultrafialové žiarenie","elektrónkové žiarenie","prúd elektrónov"],"correct":[false,false,false,true],"fingerprint":"Elektrónové mikroskopy ako zdroj žiarenia používajú:|biele svetlo|biele svetlo alebo ultrafialové žiarenie|elektrónkové žiarenie|prúd elektrónov"},{"id":"1-5","number":5,"category":1,"text":"Elektrónové mikroskopy:","options":["ako zdroj žiarenia využívajú prúd fotónov","nevyžadujú špeciálnu úpravu preparátov","vyžadujú špeciálnu prípravu preparátov","ako zdroj žiarenia využívajú prúd elektrónov"],"correct":[false,false,true,true],"fingerprint":"Elektrónové mikroskopy:|ako zdroj žiarenia využívajú prúd fotónov|nevyžadujú špeciálnu úpravu preparátov|vyžadujú špeciálnu prípravu preparátov|ako zdroj žiarenia využívajú prúd elektrónov"},{"id":"1-6","number":6,"category":1,"text":"Elektrónový mikroskop:","options":["je typ svetelného mikroskopu, vieme ním pozorovať bunky in vitro aj in vivo","umožňuje sledovať topológiu buniek a tkanív alebo vnútorné štruktúry","vieme pozorovať rovnaké preparáty pri SEM aj TEM","rozlišovacia schopnosť je väčšia ako pri konfokálnom mikroskope, preparáty sa pripravujú špecifickým spôsobom"],"correct":[false,true,false,true],"fingerprint":"Elektrónový mikroskop:|je typ svetelného mikroskopu, vieme ním pozorovať bunky in vitro aj in vivo|umožňuje sledovať topológiu buniek a tkanív alebo vnútorné štruktúry|vieme pozorovať rovnaké preparáty pri SEM aj TEM|rozlišovacia schopnosť je väčšia ako pri konfokálnom mikroskope, preparáty sa pripravujú špecifickým spôsobom"},{"id":"1-7","number":7,"category":1,"text":"Farbenie poznáme:","options":["orientačné","špecifické","náhodné","všeobecné"],"correct":[true,true,false,false],"fingerprint":"Farbenie poznáme:|orientačné|špecifické|náhodné|všeobecné"},{"id":"1-8","number":8,"category":1,"text":"Fázový kontrast:","options":["slúži ako zdroj žiarenia pri málo kontrastných preparátoch","sa využíva na zvýraznenie niektorých štruktúr bunky","sa v mikroskopii vôbec nepoužíva","umožňuje pozorovanie priehľadných objektov s málo výrazným kontrastným rozhraním"],"correct":[false,true,false,true],"fingerprint":"Fázový kontrast:|slúži ako zdroj žiarenia pri málo kontrastných preparátoch|sa využíva na zvýraznenie niektorých štruktúr bunky|sa v mikroskopii vôbec nepoužíva|umožňuje pozorovanie priehľadných objektov s málo výrazným kontrastným rozhraním"},{"id":"1-9","number":9,"category":1,"text":"Invertovaný mikroskop:","options":["používa sa napr. pri sledovaní bunkových kultúr","umožňuje pozorova rprint":"Ktorá z nasledujúcich možností je najvhodnejšia na získanie povrchového zobrazenia objektu?|SEM – skenovací elektrónový mikroskop|TEM – transmisný elektrónový mikroskop|invertovaný mikroskop|svetelný mikroskop"},{"id":"1-14","number":14,"category":1,"text":"Ktorá z nasledujúcich možností sa používa na vizualizáciu živých buniek?","options":["SEM – skenovací elektrónový mikroskop","TEM – transmisný elektrónový mikroskop","mikroskop s fázovým kontrastom","všetky tieto"],"correct":[false,false,true,false],"fingerprint":"Ktorá z nasledujúcich možností sa používa na vizualizáciu živých buniek?|SEM – skenovací elektrónový mikroskop|TEM – transmisný elektrónový mikroskop|mikroskop s fázovým kontrastom|všetky tieto"},{"id":"1-15","number":15,"category":1,"text":"Ktoré časti mikroskopu majú zväčšujúcu schopnosť:","options":["objektív","irisová clona","kondenzor","okulár"],"correct":[true,false,false,true],"fingerprint":"Ktoré časti mikroskopu majú zväčšujúcu schopnosť:|objektív|irisová clona|kondenzor|okulár"},{"id":"1-16","number":16,"category":1,"text":"Ktorý mikroskop má obrátené poradie svetelnej a optickej časti?","options":["elektrónový","skenovací","invertovaný","rastrovací"],"correct":[false,false,true,false],"fingerprint":"Ktorý mikroskop má obrátené poradie svetelnej a optickej časti?|elektrónový|skenovací|invertovaný|rastrovací"},{"id":"1-17","number":17,"category":1,"text":"Medzi optické časti mikroskopu patrí:","options":["okulár","revolverový menič","zdroj svetla","objektív"],"correct":[true,false,false,true],"fingerprint":"Medzi optické časti mikroskopu patrí:|okulár|revolverový menič|zdroj svetla|objektív"},{"id":"1-18","number":18,"category":1,"text":"Mechanická časť mikroskopu obsahuje:","options":["tubus","revolverový menič","mikroskrutku","makroskrutku"],"correct":[true,true,true,true],"fingerprint":"Mechanická časť mikroskopu obsahuje:|tubus|revolverový menič|mikroskrutku|makroskrutku"},{"id":"1-19","number":19,"category":1,"text":"Mechanická ča sahujú veľký počet regulačných génov|ich replikácia prebieha v jadre hostiteľa"},{"id":"14-56","number":56,"category":14,"text":"Čo je typické pre lytický cyklus?","options":["vírusový genóm sa integruje do DNA hostiteľa","dochádza k okamžitej syntéze viriónov","infekcia končí lýzou hostiteľskej bunky","vírus pretrváva dlhodobo v latentnej forme"],"correct":[false,true,true,false],"fingerprint":"Čo je typické pre lytický cyklus?|vírusový genóm sa integruje do DNA hostiteľa|dochádza k okamžitej syntéze viriónov|infekcia končí lýzou hostiteľskej bunky|vírus pretrváva dlhodobo v latentnej forme"},{"id":"14-57","number":57,"category":14,"text":"Čo je charakteristické pre lyzogénny cyklus bakteriofágov?","options":["genóm vírusu sa začleňuje do DNA hostiteľa ako profág","replikácia viriónov prebieha okamžite po infekcii","aktivácia represora bráni expresii génov lytického cyklu","vírus sa množí výlučne v cytoplazme"],"correct":[true,false,true,false],"fingerprint":"Čo je charakteristické pre lyzogénny cyklus bakteriofágov?|genóm vírusu sa začleňuje do DNA hostiteľa ako profág|replikácia viriónov prebieha okamžite po infekcii|aktivácia represora bráni expresii génov lytického cyklu|vírus sa množí výlučne v cytoplazme"},{"id":"14-58","number":58,"category":14,"text":"Čo môže spôsobiť prechod lyzogénneho cyklu do lytického?","options":["aktivácia represora","inaktivácia represora v dôsledku stresu (UV žiarenie, chemikálie)","spontánna integrácia DNA do chromozómu hostiteľa","vysoká virulencia vírusu"],"correct":[false,true,false,false],"fingerprint":"Čo môže spôsobiť prechod lyzogénneho cyklu do lytického?|aktivácia represora|inaktivácia represora v dôsledku stresu (UV žiarenie, chemikálie)|spontánna integrácia DNA do chromozómu hostiteľa|vysoká virulencia vírusu"},{"id":"14-59","number":59,"category":14,"text":"Ktoré tvrdenie správne opisuje rozdiel medzi lytickým a lyzogénnym cyklom?","options":["lytický cyklus vedie k deštrukcii hostiteľskej bunky, lyzogénny nie","v lyzogénnom cykle vírus okamžite produkuje nové častice","lytický cyklus zahŕňa integráciu genómu vírusu do DNA hostiteľa","lyzogénny cyklus umožňuje vírusu perzistovať latentne v hostiteľovi"],"correct":[true,false,false,true],"fingerprint":"Ktoré tvrdenie správne opisuje rozdiel medzi lytickým a lyzogénnym cyklom?|lytický cyklus vedie k deštrukcii hostiteľskej bunky, lyzogénny nie|v lyzogénnom cykle vírus okamžite produkuje nové častice|lytický cyklus zahŕňa integráciu genómu vírusu do DNA hostiteľa|lyzogénny cyklus umožňuje vírusu perzistovať latentne v hostiteľovi"},{"id":"14-60","number":60,"category":14,"text":"Ktoré tvrdenia o víruse SARS-CoV-2 (pôvodca COVID-19) sú správne?","options":["ide o RNA vírus s pozitívnym jednovláknovým genómom (+ssRNA)","patrí do čeľade Coronaviridae, rodu Betacoronavirus","povrchový glykoproteín „spike“ sprostredkuje väzbu na receptor ACE2 hostiteľskej bunky","obsahuje reverznú transkriptázu a integruje sa do DNA hostiteľa"],"correct":[true,true,true,false],"fingerprint":"Ktoré tvrdenia o víruse SARS-CoV-2 (pôvodca COVID-19) sú správne?|ide o RNA vírus s pozitívnym jednovláknovým genómom (+ssRNA)|patrí do čeľade Coronaviridae, rodu Betacoronavirus|povrchový glykoproteín „spike“ sprostredkuje väzbu na receptor ACE2 hostiteľskej bunky|obsahuje reverznú transkriptázu a integruje sa do DNA hostiteľa"}]}];
</script><script>'use strict';
const ALL = CATEGORIES.flatMap(c => c.questions);
const BY_ID = Object.fromEntries(ALL.map(q => [q.id,q]));
const STORAGE_KEY = 'biologia-repetitorium-v1';
const freshState = () => ({version:1,seen:{},answers:{},problems:[],positions:{},test:null,view:{mode:'home'}});
let state = freshState();
try {const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved?.version===1){state={...state,...saved};for(const field of ['seen','answers','positions'])if(!state[field]||typeof state[field]!=='object'||Array.isArray(state[field]))state[field]={};state.problems=Array.isArray(state.problems)?state.problems.filter(id=>BY_ID[id]):[];if(state.test&&(!Array.isArray(state.test.ids)||state.test.ids.length!==40||state.test.ids.some(id=>!BY_ID[id])||!state.test.entries))state.test=null;}} catch {document.getElementById('storage-warning').hidden=false;}
const app=document.getElementById('app');
const escapeHTML = value => String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const percent=(done,total)=>total?Math.round(done/total*100):0;
const emptyAnswer=()=>({selected:[false,false,false,false],checked:false});
const isCorrect=(q,entry)=>q.correct.every((value,i)=>value===Boolean(entry?.selected?.[i]));
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch{document.getElementById('storage-warning').hidden=false;}}
function shuffle(values,random=Math.random){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function selectTest(random=Math.random){
 const quotas=CATEGORIES.map(c=>c.questions.length/ALL.length*40);
 const counts=quotas.map(Math.floor);
 const ranked=shuffle(CATEGORIES.map((_,i)=>i),random).sort((a,b)=>(quotas[b]-counts[b])-(quotas[a]-counts[a]));
 for(const index of ranked.slice(0,40-counts.reduce((a,b)=>a+b,0)))counts[index]++;
 const used=new Set(),ids=[];
 CATEGORIES.forEach((c,i)=>{let n=0;for(const q of shuffle(c.questions,random)){if(used.has(q.fingerprint))continue;used.add(q.fingerprint);ids.push(q.id);if(++n===counts[i])break;}if(n!==counts[i])throw new Error('Nepodarilo sa zostaviť test.');});
 return shuffle(ids,random);
}
function go(view){state.view=view;save();render();window.scrollTo({top:0,behavior:'instant'});}
function home(){go({mode:'home'});}
function beginCategory(id,problems=false){const ids=categoryIds(id,problems);go({mode:problems?'problems':'category',category:id,index:Math.min(state.positions[(problems?'p':'c')+id]||0,Math.max(0,ids.length-1))});}
function categoryIds(id,problems){return (CATEGORIES.find(c=>c.id===id)?.questions||[]).filter(q=>!problems||state.problems.includes(q.id)).map(q=>q.id);}
function startTest(){const launch=()=>{state.test={ids:selectTest(),entries:{},index:0,finished:false};go({mode:'test',index:0});};if(state.test&&!state.test.finished)confirmAction('Spustiť nový test?','Rozpracovaný test sa nahradí. Uložený progres a problémové otázky zostanú zachované.','Nový test',launch);else launch();}
function confirmAction(title,text,label,action){const dialog=document.createElement('dialog');dialog.innerHTML=`<h2>${escapeHTML(title)}</h2><p>${escapeHTML(text)}</p><div class="actions"><button class="btn cancel">Späť</button><button class="btn primary confirm">${escapeHTML(label)}</button></div>`;document.body.append(dialog);dialog.querySelector('.cancel').onclick=()=>dialog.close();dialog.querySelector('.confirm').onclick=()=>{dialog.close();action();};dialog.onclose=()=>dialog.remove();dialog.showModal();}
function renderHome(){
 const done=ALL.filter(q=>state.seen[q.id]).length;
 app.innerHTML=`<header class="header"><div><h1>Biológia</h1><p class="muted">14 kategórií · 855 otázok</p></div><div class="overall"><strong>${percent(done,ALL.length)} %</strong><p>prejdené · ${done} / 855</p></div></header><div class="categories">${CATEGORIES.map(c=>{const completed=c.questions.filter(q=>state.seen[q.id]).length;const p=percent(completed,c.questions.length);const problems=c.questions.filter(q=>state.problems.includes(q.id)).length;return `<article class="category"><button class="category-open" data-category="${c.id}"><span class="number">${String(c.id).padStart(2,'0')}</span><span class="category-title">${escapeHTML(c.name)}</span><span class="category-meta"><span>${c.questions.length} otázok · prejdené ${completed}</span><span>${p} %</span></span><span class="track" aria-hidden="true"><span style="width:${p}%"></span></span></button><button class="problem-link" data-problems="${c.id}" aria-label="Problémové otázky: ${escapeHTML(c.name)}, ${problems}">☆ Problémové · ${problems}</button></article>`;}).join('')}</div><button class="launch" id="new-test"><strong>Spustiť test</strong><span>40 otázok →</span></button>${state.test?`<div class="test-controls"><button class="btn" id="resume-test">${state.test.finished?'Výsledok posledného testu':'Pokračovať v teste'}</button></div>`:''}`;
 app.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>beginCategory(Number(b.dataset.category)));
 app.querySelectorAll('[data-problems]').forEach(b=>b.onclick=()=>beginCategory(Number(b.dataset.problems),true));
 document.getElementById('new-test').onclick=startTest;
 const resume=document.getElementById('resume-test');if(resume)resume.onclick=()=>go({mode:state.test.finished?'result':'test',index:state.test.index});
}
function currentContext(){const view=state.view;const test=view.mode==='test';const ids=test?state.test?.ids:categoryIds(view.category,view.mode==='problems');if(!ids?.length)return null;const index=Math.min(Math.max(0,Number(view.index)||0),ids.length-1);view.index=index;const q=BY_ID[ids[index]];const entries=test?state.test.entries:state.answers;let entry=entries[q.id];if(!entry||!Array.isArray(entry.selected)||entry.selected.length!==4)entry=entries[q.id]=emptyAnswer();return{view,test,ids,index,q,entry};}
function evaluateQuestion(context){context.entry.checked=true;state.seen[context.q.id]=true;save();renderQuiz();}
function moveQuestion(delta){const c=currentContext();if(!c)return;const index=Math.min(Math.max(c.index+delta,0),c.ids.length-1);if(c.test)state.test.index=index;else state.positions[(c.view.mode==='problems'?'p':'c')+c.view.category]=index;go({...c.view,index});}
function finishTest(){const finish=()=>{for(const id of state.test.ids){const entry=state.test.entries[id]||(state.test.entries[id]=emptyAnswer());entry.checked=true;state.seen[id]=true;}state.test.finished=true;go({mode:'result'});};const pending=state.test.ids.filter(id=>!state.test.entries[id]?.checked).length;confirmAction('Vyhodnotiť celý test?',`Vyhodnotí sa všetkých 40 otázok${pending?`, z toho ${pending} ešte nevyhodnotených`:''}. Aj neoznačené možnosti sú súčasťou odpovede.`,'Vyhodnotiť test',finish);}
function renderQuiz(){
 const c=currentContext();if(!c){app.innerHTML='<div class="quiz-top"><button class="btn" id="home">← Kategórie</button></div><div class="empty"><h2>Žiadne problémové otázky</h2><p class="muted">Otázku sem pridáš hviezdičkou pri učení.</p></div>';document.getElementById('home').onclick=home;return;}
 const {q,entry,index,ids,test}=c;const category=CATEGORIES.find(cat=>cat.id===q.category);const isStar=state.problems.includes(q.id);const result=entry.checked;const correct=isCorrect(q,entry);const completed=ids.filter(id=>test?state.test.entries[id]?.checked:state.seen[id]).length;
 app.innerHTML=`<div class="quiz-top"><button class="btn" id="home">← Kategórie</button><div class="quiz-title">${test?'Test · ':c.view.mode==='problems'?'Problémové · ':''}${escapeHTML(category.name)}<br>${index+1} / ${ids.length} · vyhodnotené ${completed}</div></div><div class="track quiz-progress" aria-hidden="true"><span style="width:${percent(completed,ids.length)}%"></span></div><section class="question" aria-label="Otázka"><h2>${q.number}. ${escapeHTML(q.text)}</h2><div class="answers">${q.options.map((text,i)=>{const good=result&&q.correct[i];const bad=result&&!q.correct[i]&&entry.selected[i];const missed=result&&q.correct[i]&&!entry.selected[i];const status=good?(missed?'Správna možnosť, neoznačená':'Správna možnosť'):bad?'Nesprávne označená možnosť':'';return `<label class="answer ${good?'good':''} ${bad?'bad':''} ${result?'locked':''}"><input type="checkbox" data-option="${i}" ${entry.selected[i]?'checked':''} ${result?'disabled':''} aria-label="${String.fromCharCode(97+i)}) ${escapeHTML(text)}${status?'. '+status:''}"><span class="answer-text">${String.fromCharCode(97+i)}) ${escapeHTML(text)}</span>${result&&(bad||missed)?'<span class="mark" aria-hidden="true">✕</span>':good?'<span class="mark ok" aria-hidden="true">✓</span>':''}</label>`;}).join('')}</div>${result?`<p class="feedback ${correct?'correct':'incorrect'}" role="status">${correct?'✓ Správne':'✕ Nesprávne'}${!correct?' · Zelené možnosti sú správne. Krížik označuje chybu vo výbere.':''}</p>`:''}</section><div class="actions"><div class="actions-group">${!result?'<button class="btn primary" id="evaluate">Vyhodnotiť</button>':test?'':'<button class="btn" id="retry">Skúsiť znova</button>'}<button class="btn ${isStar?'starred':''}" id="star" aria-pressed="${isStar}">${isStar?'★ Medzi problémovými':'☆ Medzi problémové'}</button></div><div class="actions-group"><button class="btn" id="previous" ${index===0?'disabled':''}>← Späť</button><span class="position">${index+1} / ${ids.length}</span><button class="btn" id="next" ${index===ids.length-1?'disabled':''}>Ďalšia →</button></div></div>${test?`<div class="actions"><button class="btn" id="finish">${state.test.finished?'Výsledok testu':'Vyhodnotiť celý test'}</button></div>`:''}`;
 document.getElementById('home').onclick=home;
 app.querySelectorAll('[data-option]').forEach(input=>input.onchange=()=>{entry.selected[Number(input.dataset.option)]=input.checked;save();});
 const evaluate=document.getElementById('evaluate');if(evaluate)evaluate.onclick=()=>evaluateQuestion(c);
 const retry=document.getElementById('retry');if(retry)retry.onclick=()=>{state.answers[q.id]=emptyAnswer();save();renderQuiz();};
 document.getElementById('star').onclick=()=>{if(state.problems.includes(q.id))state.problems=state.problems.filter(id=>id!==q.id);else state.problems.push(q.id);save();renderQuiz();};
 document.getElementById('previous').onclick=()=>moveQuestion(-1);document.getElementById('next').onclick=()=>moveQuestion(1);
 const finish=document.getElementById('finish');if(finish)finish.onclick=()=>state.test.finished?go({mode:'result'}):finishTest();
}
function renderResult(){if(!state.test)return home();const ids=state.test.ids;const correct=ids.filter(id=>isCorrect(BY_ID[id],state.test.entries[id])).length;app.innerHTML=`<header class="header"><button class="btn" id="home">← Kategórie</button><span class="muted">Výsledok testu</span></header><section class="result"><h1>Test dokončený</h1><div class="score">${percent(correct,40)} %</div><p>${correct} / 40 správnych otázok</p><p>Správna otázka = presne označené všetky správne možnosti.</p><div class="actions"><button class="btn primary" id="new-test">Nový test</button><button class="btn" id="review">Prejsť odpovede</button></div></section><div class="review-grid" aria-label="Odpovede v teste">${ids.map((id,i)=>{const ok=isCorrect(BY_ID[id],state.test.entries[id]);return `<button class="${ok?'':'wrong'}" data-review="${i}" aria-label="Otázka ${i+1}: ${ok?'správne':'nesprávne'}">${i+1} ${ok?'✓':'✕'}</button>`;}).join('')}</div>`;document.getElementById('home').onclick=home;document.getElementById('new-test').onclick=startTest;document.getElementById('review').onclick=()=>go({mode:'test',index:0});app.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>go({mode:'test',index:Number(b.dataset.review)}));}
function render(){if(!state.view||!['home','category','problems','test','result'].includes(state.view.mode))state.view={mode:'home'};if(['test','result'].includes(state.view.mode)&&!state.test)state.view={mode:'home'};if(state.view.mode==='home')renderHome();else if(state.view.mode==='result')renderResult();else renderQuiz();}
render();
</script></body></html>
